name: Digest image validation

on:
  push:
    branches: [main]
    paths:
      - "content/ready-digest.json"
  pull_request:
    branches: [main]
    paths:
      - "content/ready-digest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate three stories and verify image URLs
        run: node scripts/validate-digest.mjs --check-remote
