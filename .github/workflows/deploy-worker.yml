name: Test and deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "migrations/**"
      - "wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-main
  cancel-in-progress: false

jobs:
  test:
    name: Run worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test

  deploy:
    name: Apply D1 migrations and deploy Worker
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DEPLOY_CONFIGURED: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED != 'true'
        run: |
          {
            echo "## Deployment skipped"
            echo "Tests completed, but deployment was skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured in repository Actions secrets."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED == 'true'
        run: npm install --no-audit --no-fund
      - name: Apply remote D1 migrations
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED == 'true'
        run: npx wrangler d1 migrations apply telegram-news-state --remote
      - name: Deploy Worker
        if: env.CLOUDFLARE_DEPLOY_CONFIGURED == 'true'
        run: npx wrangler deploy
