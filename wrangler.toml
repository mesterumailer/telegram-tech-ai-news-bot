name = "telegram-tech-ai-news-publisher"
main = "src/index.js"
compatibility_date = "2026-10-29"
keep_vars = true

[triggers]
# Every 8 hours (UTC). Each run publishes at most one pending story; overflow beyond ten eligible pending stories is discarded.
# keep_vars=true preserves existing Dashboard variables; confirm the live PUBLISH_ENABLED value there.
crons = ["0 */8 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "telegram-news-state"
database_id = "9e2851cf-cb66-4c46-b50f-beddc71184ad"
migrations_dir = "migrations"

[vars]
PUBLISH_ENABLED = "true"
TELEGRAM_TEST_ENABLED = "false"
GITHUB_OWNER = "mesterumailer"
GITHUB_REPO = "telegram-tech-ai-news-bot"
GITHUB_BRANCH = "main"
GITHUB_PATH = "content/ready-digest.json"

# Branch Previews use an isolated D1 database and cannot publish to Telegram.
[previews.vars]
PUBLISH_ENABLED = "false"
TELEGRAM_TEST_ENABLED = "false"
GITHUB_OWNER = "mesterumailer"
GITHUB_REPO = "telegram-tech-ai-news-bot"
GITHUB_BRANCH = "main"
GITHUB_PATH = "content/ready-digest.json"

# D1 is intentionally not bound to branch Previews while Cloudflare's
# preview-version API returns error 10181 for this existing database UUID.
# Production retains its top-level DB binding unchanged. Unit tests cover
# the manual refresh route with an isolated in-memory D1 test double.

