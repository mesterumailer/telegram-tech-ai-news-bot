name = "telegram-tech-ai-news-publisher"
main = "src/index.js"
compatibility_date = "2026-10-29"
keep_vars = true

[triggers]
# Every 6 hours (UTC). Cron timing is approximate, not a guarantee of exact minute execution.
crons = ["0 */6 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "telegram-news-state"
database_id = "9e2851cf-cb66-4c46-b50f-beddc71184ad"
migrations_dir = "migrations"

[vars]
PUBLISH_ENABLED = "false"
TELEGRAM_TEST_ENABLED = "false"
GITHUB_OWNER = "mesterumailer"
GITHUB_REPO = "telegram-tech-ai-news-bot"
GITHUB_BRANCH = "main"
GITHUB_PATH = "content/ready-digest.json"
